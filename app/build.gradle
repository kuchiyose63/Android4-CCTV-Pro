plugins {
    id 'com.android.application'
}

android {
    namespace 'com.diy.cctv4'
    compileSdk 33

    defaultConfig {
        applicationId "com.diy.cctv4"
        minSdk 14        // Kompatibel penuh dengan Android 4.0+
        targetSdk 22     // Tidak memicu dialog izin runtime Android 6+
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
