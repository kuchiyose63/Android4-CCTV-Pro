name: Build APK CCTV Android 4

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6.4'

      - name: Cari Folder Proyek & Kompilasi APK
        run: |
          echo "=== Daftar Seluruh File di Repo ==="
          find . -maxdepth 4 -not -path '*/.*'
          
          # Hapus spasi tidak sengaja pada nama file build.gradle jika ada
          find . -name "build.gradle*" -exec bash -c 'mv "$0" "${0%"${0##*[![:space:]]}"}" 2>/dev/null || true' {} \;
          
          # Cari lokasi build.gradle dan pindah ke direktorinya
          GRADLE_FILE=$(find . -name "build.gradle" | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: File build.gradle sama sekali tidak ditemukan!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "Menjalankan build di folder: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload Hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: CCTV-Android4-APK
          path: "**/build/outputs/apk/debug/*.apk"
