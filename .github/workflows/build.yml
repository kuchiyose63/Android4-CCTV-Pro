name: Build APK CCTV Android 4

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6.4'

      - name: Bersihkan Nama File & Kompilasi APK
        run: |
          # Hapus karakter spasi atau baris baru (Enter) tersembunyi di ujung semua nama file
          python3 -c '
          import os
          for root, dirs, files in os.walk("."):
              if ".git" in root: continue
              for f in files:
                  clean = f.strip()
                  if f != clean:
                      os.rename(os.path.join(root, f), os.path.join(root, clean))
                      print("Fixed filename:", repr(f), "->", repr(clean))
          '
          
          GRADLE_FILE=$(find . -name "build.gradle" | head -n 1)
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload Hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: CCTV-Android4-APK
          path: "**/build/outputs/apk/debug/*.apk"
